<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сброс пароля - PC Parts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0f1e 0%, #05080f 100%);
        }
        .reset-container {
            max-width: 450px;
            width: 90%;
            padding: 40px;
            border-radius: 20px;
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo span {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6c5ce7, #00d2ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: white;
            font-size: 1.5rem;
        }
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 12px;
            font-size: 16px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            outline: none;
        }
        .input-group input:focus {
            border-color: #6c5ce7;
        }
        .input-group label {
            position: absolute;
            top: 50%;
            left: 12px;
            transform: translateY(-50%);
            color: #b2bec3;
            font-size: 14px;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 0;
            transform: translateY(-50%) scale(0.85);
            background: #0a0f1e;
            padding: 0 5px;
            color: #6c5ce7;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6c5ce7, #a463f5);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .message.success { color: #00b894; }
        .message.error { color: #ff7675; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #b2bec3;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #6c5ce7;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo"><span>PC Parts</span></div>
        <h2>Сброс пароля</h2>
        <div id="step1">
            <div class="input-group">
                <input type="password" id="newPassword" placeholder=" ">
                <label>Новый пароль</label>
            </div>
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder=" ">
                <label>Подтвердите пароль</label>
            </div>
            <button class="submit-btn" id="resetBtn">Сбросить пароль</button>
        </div>
        <div id="step2" style="display: none;">
            <p style="text-align: center; color: #00b894;">✓ Пароль успешно изменён!</p>
            <a href="/pcshop/" class="back-link">Вернуться на главную</a>
        </div>
        <div id="message" class="message"></div>
        <a href="/pcshop/" class="back-link">← На главную</a>
    </div>

    <script>
        (function() {
            const API_URL = '/pcshop/api/';
            
            // Получаем параметры из URL
            const urlParams = new URLSearchParams(window.location.search);
            const resetToken = urlParams.get('token');
            const resetEmailRaw = urlParams.get('email');
            
            // Декодируем email
            let resetEmail = resetEmailRaw;
            try {
                if (resetEmailRaw) {
                    resetEmail = decodeURIComponent(resetEmailRaw);
                }
            } catch(e) {
                console.error('Ошибка декодирования email:', e);
            }
            
            console.log('Token:', resetToken);
            console.log('Email raw:', resetEmailRaw);
            console.log('Email decoded:', resetEmail);
            
            if (!resetToken || !resetEmail) {
                document.getElementById('message').innerHTML = 'Недействительная ссылка';
                document.getElementById('message').className = 'message error';
                document.getElementById('step1').style.display = 'none';
            }
            
            document.getElementById('resetBtn').addEventListener('click', async function() {
                const password = document.getElementById('newPassword').value;
                const confirm = document.getElementById('confirmPassword').value;
                const messageDiv = document.getElementById('message');
                
                if (!password || !confirm) {
                    messageDiv.innerHTML = 'Заполните все поля';
                    messageDiv.className = 'message error';
                    return;
                }
                
                if (password !== confirm) {
                    messageDiv.innerHTML = 'Пароли не совпадают';
                    messageDiv.className = 'message error';
                    return;
                }
                
                if (password.length < 4) {
                    messageDiv.innerHTML = 'Пароль должен содержать минимум 4 символа';
                    messageDiv.className = 'message error';
                    return;
                }
                
                try {
                    const response = await fetch(API_URL + 'reset_password.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: resetEmail,
                            token: resetToken,
                            password: password
                        })
                    });
                    const data = await response.json();
                    console.log('Ответ сервера:', data);
                    
                    if (data.success) {
                        document.getElementById('step1').style.display = 'none';
                        document.getElementById('step2').style.display = 'block';
                        messageDiv.innerHTML = '';
                    } else {
                        messageDiv.innerHTML = data.message;
                        messageDiv.className = 'message error';
                    }
                } catch (error) {
                    console.error('Ошибка:', error);
                    messageDiv.innerHTML = 'Ошибка соединения с сервером';
                    messageDiv.className = 'message error';
                }
            });
        })();
    </script>
</body>
</html>
